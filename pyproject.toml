[project]
name = "neural-noodle"
version = "0.1.0"
description = "Reinforcement learning for Snake, measured against a near-optimal planner."
authors = [{ name = "Tristan Tibbs", email = "tristantibbs@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1,<3",
    "numpy>=1.26,<3",
    "torch>=2.11,<2.12",
    "matplotlib>=3.9.2,<4",
    "pyyaml>=6.0.2,<7",
    "loguru>=0.7.2,<1",
    "pydantic>=2.9,<3",
    "wandb>=0.19,<1",
    "imageio>=2.34,<3",
    "imageio-ffmpeg>=0.5,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noodle", "src/neural"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[tool.ruff]
line-length = 80
indent-width = 4
src = ["src"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, N: naming, B: bugbear, A: builtins,
# BLE: blind except, ICN: import conventions, Q: quotes, ANN: annotations,
# I: import sorting, UP: pyupgrade, D: pydocstyle (Google style).
select = [
    "E", "F", "W", "N", "BLE", "B", "A", "ICN", "Q", "ANN", "I", "UP", "D",
]
ignore = [
    "D104", # Missing docstring in public package (__init__.py).
    "D107", # Init args are documented in the class docstring.
]

[tool.ruff.lint.isort]
# Pin first-party packages so import grouping is identical in CI and
# locally, regardless of what is installed in the environment.
known-first-party = ["neural", "noodle"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
