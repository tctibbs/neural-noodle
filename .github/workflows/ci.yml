name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check src/neural tests
      - name: Ruff format
        run: uv run ruff format --check src/neural tests
      - name: Ty
        # --extra-search-path makes ty resolve the first-party `neural`
        # package from the src layout. ty 0.0.49 auto-detects this on
        # some platforms but not on Linux, and its config keys for the
        # source root postdate this version, so the flag is the portable
        # way to pin it.
        run: uv run ty check --extra-search-path src src/neural
      - name: Tests
        run: uv run pytest tests -q
