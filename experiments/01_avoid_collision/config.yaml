# Configuration for training the Snake RL model

environment:
  width: 400        # Game window width
  height: 400       # Game window height
  grid_size: 8      # Number of rows and columns in the grid

  reward_policy:
    collision: -1         # Penalty if the snake collides
    fruit_eaten: 1        # Reward for eating fruit
    step: 0               # Reward per step (survival reward)

agent:
  model:
    hidden_layers:         
      - 256               # First hidden layer size
      - 256               # Second hidden layer size
  
  learning_rate: 0.001    # Optimizer learning rate

  epsilon:
    start: 0.00             # Starting exploration rate (epsilon-greedy)
    end: 0.00               # Minimum exploration rate
    decay_steps: 1000       # Total number of steps for epsilon decay

training:
  episodes: 250               # Total number of training episodes
  steps_per_second: 1000      # Number of steps executed per second
  target_update_interval: 1   # Frequency of target Q-network updates (in episodes)
